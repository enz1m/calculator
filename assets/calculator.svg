<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Calculator</title>
  <defs>
    <filter id="enz-calculator-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- square keyline; body 80 x 92 (24..104 x 18..110) radius 12; plain solar strip; LCD 64 x 18 with one reading;
       round keys r 7 on 17 / 16 px steps (columns 38 55 72 89, rows 66 82 98); one light key; orange operator column
       carries the only signs (times / minus / plus, 3 px bars) so it stays calm at small sizes -->
  <g filter="url(#enz-calculator-drop)">
    <rect x="24" y="18" width="80" height="92" rx="12" fill="#2F3238"/>
  </g>
  <rect x="62" y="25" width="34" height="7" rx="2" fill="#4A3B30"/>
  <rect x="32" y="37" width="64" height="18" rx="4" fill="#C9D3C3"/>
  <rect x="58" y="42" width="32" height="8" rx="3" fill="#2B3140"/>
  <g fill="#5E6676"><circle cx="55" cy="66" r="7"/><circle cx="72" cy="66" r="7"/><circle cx="38" cy="82" r="7"/><circle cx="55" cy="82" r="7"/><circle cx="72" cy="82" r="7"/><circle cx="38" cy="98" r="7"/><circle cx="55" cy="98" r="7"/><circle cx="72" cy="98" r="7"/></g>
  <circle cx="38" cy="66" r="7" fill="#E6ECF4"/>
  <g fill="#FF9F0A"><circle cx="89" cy="66" r="7"/><circle cx="89" cy="82" r="7"/><circle cx="89" cy="98" r="7"/></g>
  <g fill="#FFFFFF">
    <g transform="rotate(45 89 66)"><rect x="84" y="64.5" width="10" height="3" rx="1.5"/><rect x="87.5" y="61" width="3" height="10" rx="1.5"/></g>
    <rect x="84" y="80.5" width="10" height="3" rx="1.5"/>
    <rect x="84" y="96.5" width="10" height="3" rx="1.5"/><rect x="87.5" y="93" width="3" height="10" rx="1.5"/>
  </g>
</svg>
